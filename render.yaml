services:
  - type: web
    name: potxpress
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate && npm start --workspace @potxpress/server
    # 存活检查，不访问数据库：数据库抖动时不应让 Render 重启实例。
    # 需要确认数据库可用时请看 /api/health/ready。
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_DISPLAY_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: TRUST_PROXY
        value: "1"
